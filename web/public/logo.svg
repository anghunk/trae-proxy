<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Trae Proxy 深色标志">
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <!-- 近黑圆角底，保证深浅两套主题下都有清晰边界。 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#0E0F12" />
  <rect
    x="1.5"
    y="1.5"
    width="509"
    height="509"
    rx="110.5"
    ry="110.5"
    fill="none"
    stroke="#292B30"
    stroke-width="3"
  />

  <g clip-path="url(#tile)">
    <!-- 猫体由「两只耳朵 + 身体圆顶」同色叠加而成。
         身体最后绘制，覆盖耳根描边，合并成一个无内部接缝的轮廓。 -->
    <g fill="#565B65" stroke="#565B65" stroke-width="12" stroke-linejoin="round">
      <path
        d="M 80 292
           C 82 250 90 196 108 158
           C 124 144 152 152 172 178
           C 186 210 188 246 182 276
           Z"
      />
      <path
        d="M 432 292
           C 430 250 422 196 404 158
           C 388 144 360 152 340 178
           C 326 210 324 246 330 276
           Z"
      />
      <path
        d="M 62 512
           C 62 404 58 322 98 270
           C 132 226 192 222 256 222
           C 320 222 380 226 414 270
           C 454 322 450 404 450 512
           Z"
      />
    </g>
    <g fill="#393D44">
      <path
        d="M 80 292
           C 82 250 90 196 108 158
           C 124 144 152 152 172 178
           C 186 210 188 246 182 276
           Z"
      />
      <path
        d="M 432 292
           C 430 250 422 196 404 158
           C 388 144 360 152 340 178
           C 326 210 324 246 330 276
           Z"
      />
      <path
        d="M 62 512
           C 62 404 58 322 98 270
           C 132 226 192 222 256 222
           C 320 222 380 226 414 270
           C 454 322 450 404 450 512
           Z"
      />
    </g>

    <!-- 耳内暖色点缀，保留原标志的珊瑚色记忆点。 -->
    <path
      d="M 104 254
         C 106 216 114 184 126 166
         C 138 170 148 196 152 232
         C 136 250 120 256 104 254
         Z"
      fill="#D9603F"
    />
    <path
      d="M 408 254
         C 406 216 398 184 386 166
         C 374 170 364 196 360 232
         C 376 250 392 256 408 254
         Z"
      fill="#D9603F"
    />

    <!-- 中央拱门呼应代理 / 网关，是小尺寸下最醒目的识别元素。 -->
    <path
      d="M 164 512
         L 164 470
         A 92 92 0 0 1 348 470
         L 348 512
         Z"
      fill="#EFE7D8"
    />

    <!-- 双眼与鼻头落在拱门上方的头部区域。 -->
    <ellipse cx="210" cy="302" rx="13" ry="16" fill="#EFE7D8" />
    <ellipse cx="302" cy="302" rx="13" ry="16" fill="#EFE7D8" />
    <path
      d="M 256 322
         C 266 322 271 329 266 335
         C 261 341 251 341 247 334
         C 244 328 250 322 256 322
         Z"
      fill="#E0644A"
    />
    <path
      d="M 241 342
         C 248 349 264 349 271 342
         C 264 355 248 355 241 342
         Z"
      fill="#E0644A"
    />
  </g>
</svg>
